<!DOCTYPE html>
<html lang="fr">

<head>
    <meta charset="UTF-8">
    <title>NetflixLight</title>
    <link rel="stylesheet" href="/css/style.css">
</head>

<body>

<header>
    <h1>NETFLIXLIGHT</h1>
    <nav>
        <a href="index.html">Accueil</a>
        <a href="favoris.html">Favoris</a>
        <a href="authentication.html">Connexion</a>
    </nav>
</header>

<!-- HERO SLIDER -->
<section class="hero" id="hero">

    <div class="hero-content">
        <h2 id="heroTitle"></h2>
        <p id="heroInfo"></p>

        <a href="film.html" class="btn-films">Voir les films et séries</a>
    </div>

    <!-- FLECHES -->
    <button class="hero-btn left" id="prevBtn">❮</button>
    <button class="hero-btn right" id="nextBtn">❯</button>

</section>

<!-- TENDANCES -->
<section>
    <h2>Tendances du moment</h2>
    <div class="carousel" id="trending"></div>
</section>

<!-- FILMS -->
<section>
    <h2>Films populaires</h2>
    <div class="carousel" id="movies"></div>
</section>

<!-- SERIES -->
<section>
    <h2>Séries populaires</h2>
    <div class="carousel" id="series"></div>
</section>

<!-- TOP RATED -->
<section>
    <h2>Contenus les mieux notés</h2>
    <div class="carousel" id="top"></div>
</section>

<!-- ACTION -->
<section>
    <h2>Action</h2>
    <div class="carousel" id="action"></div>
</section>

<!-- COMEDIE -->
<section>
    <h2>Comédie</h2>
    <div class="carousel" id="comedy"></div>
</section>

<script src="/js/script.js"></script>

</body>
</html>
