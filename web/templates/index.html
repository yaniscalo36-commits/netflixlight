<!DOCTYPE html>
<html lang="fr">

<head>
    <meta charset="UTF-8">
    <title>NetflixLight</title>
    <link rel="stylesheet" href="/css/style.css">
</head>

<body>

<header>
    <h1>NETFLIXLIGHT</h1>
    <!-- NAVIGATION -->
    <nav>
        <a href="index.html">Accueil</a>
        <a href="favoris.html">Favoris</a>
        <a href="authentication.html">Connexion</a>
        <button id="themeToggle">Mode clair</button>

    </nav>

    <!-- BARRE DE RECHERCHE (centrée via CSS) -->
    <input type="text" id="searchInput" placeholder="Rechercher..." />
</header>
<!-- ================= HERO ================= -->
<section class="hero" id="hero">

    <div class="hero-content">
        <h2 id="heroTitle"></h2>
        <p id="heroInfo"></p>

        <div class="hero-buttons">
            <button id="heroDetail" class="btn-detail">Détails</button>
            <button id="heroFav" class="btn-fav">Favoris</button>
        </div>
    </div>

</section>


<!-- ================= RECHERCHE ================= -->
<section id="searchSection">
    <h2>Résultats</h2>
    <div class="carousel" id="searchResults"></div>
</section>
<!-- ================= CONTENU ================= -->
<!-- TENDANCES -->
<section>
    <h2>Tendances du moment</h2>
    <div class="carousel" id="trending"></div>
</section>

<!-- FILMS -->
<section>
    <h2>Films populaires</h2>
    <div class="carousel" id="movies"></div>
</section>

<!-- SERIES -->
<section>
    <h2>Séries populaires</h2>
    <div class="carousel" id="series"></div>
</section>

<!-- TOP RATED -->
<section>
    <h2>Contenus les mieux notés</h2>
    <div class="carousel" id="top"></div>
</section>

<!-- ACTION -->
<section>
    <h2>Action</h2>
    <div class="carousel" id="action"></div>
</section>

<!-- COMEDIE -->
<section>
    <h2>Comédie</h2>
    <div class="carousel" id="comedy"></div>
</section>
<!-- ================= SCRIPTS ================= -->
<script src="/js/script.js"></script>
<script src="/js/search.js"></script>

</body>
</html>
