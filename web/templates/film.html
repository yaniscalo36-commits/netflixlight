<!DOCTYPE html>
<html lang="fr">

<head>
    <meta charset="UTF-8">
    <title>Détail - NetflixLight</title>
    <link rel="stylesheet" href="/css/style.css">
</head>

<body>

<header>
    <h1>NETFLIXLIGHT</h1>
    <!-- NAVIGATION -->
    <nav>
        <a href="index.html">Accueil</a>
        <a href="favoris.html">Favoris</a>
        <a href="authentication.html">Connexion</a>
    </nav>
</header>


<!-- ================= HERO DETAIL ================= -->
<section class="hero" id="filmHero">
    <div class="hero-content">
        <h2 id="filmTitle">Chargement...</h2>
        <p id="filmOverview"></p>
        <p id="filmInfo"></p>

        <button id="favBtn" class="btn-films">Ajouter aux favoris</button>
    </div>
</section>
<!-- ================= LECTEUR VIDEO ================= -->
<section>

    <div class="player" id="player">

        <video id="video">
            <source src="https://samplelib.com/lib/preview/mp4/sample-5s.mp4" type="video/mp4">
        </video>

        <div class="controls" id="controls">

            <!-- BARRE DE PROGRESSION -->
            <div class="progress" id="progress">
                <div class="progress-bar" id="progressBar"></div>
            </div>

            <!-- BOUTONS -->
            <div class="buttons">
                <button id="playPause">▶</button>
                <span id="time">0:00 / 0:00</span>

                <input type="range" id="volume" min="0" max="1" step="0.1">

                <button id="mute">🔊</button>
                <button id="fullscreen">⛶</button>
            </div>
        </div>
    </div>
</section>


<!-- ================= CAST ================= -->
<section>
    <h2>Acteurs</h2>
    <div class="carousel" id="cast">
        <p>Chargement...</p>
    </div>
</section>


<!-- ================= SIMILAIRES ================= -->
<section>
    <h2>Films similaires</h2>
    <div class="carousel" id="similar">
        <p>Chargement...</p>
    </div>
</section>
<!-- ================= SCRIPT ================= -->
<script src="/js/script.js"></script>

</body>
</html>
